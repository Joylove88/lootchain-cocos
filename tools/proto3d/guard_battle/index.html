<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ═══════════════════════════ 0. 参数 ═══════════════════════════
const Q = new URLSearchParams(location.search);
const UA_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
/**
 * 三档画质。shortSide = 画布短边封顶(像素比跟着封顶,对应游戏里的「极致 1080 / 流畅 720」);
 * ao = 环境光遮蔽的分辨率倍率(0 = 关);bloom = 泛光分辨率倍率;shadow = 主光阴影贴图边长(0 = 关,只留脚下柔影);
 * pl = 火盆 / 水晶那四盏固定点光是不是真的逐像素去算(否 = 换成贴在地上的光斑;技能的三盏动态光任何档都是真的);
 * env = 要不要环境反射 + 镜头方向的补光 + 细节法线。
 * 在弱显卡上实测(见 shots.py profile):最贵的是「每个像素算 7 盏点光 + 环境反射」和全分辨率的环境光遮蔽,投影反而便宜 ——
 * 所以中 / 低档先砍前两样,投影三档都留着。
 */
const TIER = {
  high: { label: '高', shortSide: 1440, msaa: 4, shadow: 2048, ao: 1, aoSamples: 16, bloom: 1, ground: 4096, grass: 2600, fx: 1, pl: true, env: true },
  mid: { label: '中', shortSide: 1080, msaa: 0, shadow: 1024, ao: 0.5, aoSamples: 8, bloom: 0.5, ground: 2048, grass: 1500, fx: 0.7, pl: false, env: true },
  low: { label: '低', shortSide: 720, msaa: 0, shadow: 1024, ao: 0, aoSamples: 0, bloom: 0.25, ground: 2048, grass: 700, fx: 0.45, pl: false, env: false },
};
let tierName = TIER[Q.get('q')] ? Q.get('q') : (UA_MOBILE ? 'mid' : 'high');
let T = TIER[tierName];
const OPT = {
  px: Q.get('px') ? parseFloat(Q.get('px')) : 0,
  dpr: Q.get('dpr') ? parseFloat(Q.get('dpr')) : 0,
  auto: Q.get('auto') !== '0',
  drift: Q.get('drift') !== '0',
  sprite: Q.get('sprite') !== null ? parseInt(Q.get('sprite'), 10) : 1,
  art: Q.get('art') || '../../../assets/resources/',
};
if (Q.get('ui') === '0') document.body.classList.add('noui');

// ═══════════════════════════ 1. 小工具 ═══════════════════════════
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const bump = (x, c, w) => Math.exp(-((x - c) * (x - c)) / (2 * w * w));
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function hash2(ix, iy, seed) {
  let h = Math.imul(ix, 374761393) ^ Math.imul(iy, 668265263) ^ Math.imul(seed + 1, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, seed) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash2(ix, iy, seed), hash2(ix + 1, iy, seed), ux), lerp(hash2(ix, iy + 1, seed), hash2(ix + 1, iy + 1, seed), ux), uy);
}
function fbm(x, y, oct, seed) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, seed + i * 17); n += a; a *= 0.5; f *= 2.03; }
  return s / n;
}
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const CAN_FILTER = typeof makeCanvas(1, 1).getContext('2d').filter === 'string';
/** 模糊一张画布(有 filter 用 filter,没有就缩小再放大)。 */
function blurred(src, r) {
  const w = src.width, h = src.height, out = makeCanvas(w, h), o = out.getContext('2d');
  if (r < 0.35) { o.drawImage(src, 0, 0); return out; }
  if (CAN_FILTER) { o.filter = `blur(${r.toFixed(2)}px)`; o.drawImage(src, 0, 0); o.filter = 'none'; return out; }
  const k = Math.max(2, Math.round(r * 1.6)), sw = Math.max(1, Math.round(w / k)), sh = Math.max(1, Math.round(h / k));
  const s = makeCanvas(sw, sh), sc = s.getContext('2d'); sc.imageSmoothingQuality = 'high'; sc.drawImage(src, 0, 0, sw, sh);
  o.imageSmoothingQuality = 'high'; o.drawImage(s, 0, 0, w, h); return out;
}
/** 可无缝平铺的噪声瓦片(灰度,以 128 为中性,叠加混合用)。 */
function noiseTile(size, cells, oct, seed, contrast) {
  const cv = makeCanvas(size, size), ctx = cv.getContext('2d'), img = ctx.createImageData(size, size), d = img.data;
  const per = (ix, iy, p, s) => hash2(((ix % p) + p) % p, ((iy % p) + p) % p, s);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    let v = 0, a = 0.5, n = 0, p = cells;
    for (let o = 0; o < oct; o++) {
      const fx = x / size * p, fy = y / size * p, ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy;
      const ux = tx * tx * (3 - 2 * tx), uy = ty * ty * (3 - 2 * ty), s = seed + o * 31;
      v += a * lerp(lerp(per(ix, iy, p, s), per(ix + 1, iy, p, s), ux), lerp(per(ix, iy + 1, p, s), per(ix + 1, iy + 1, p, s), ux), uy);
      n += a; a *= 0.5; p *= 2;
    }
    const g = Math.round(clamp((v / n - 0.5) * contrast + 0.5, 0, 1) * 255), i = (y * size + x) * 4;
    d[i] = d[i + 1] = d[i + 2] = g; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}
/** 把噪声瓦片按任意缩放 / 旋转铺满画布并以指定混合方式叠上去(多层不同比例和角度叠起来就看不出重复)。 */
function overlayPattern(ctx, tile, W, H, scale, alpha, mode, rot, ox, oy) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.globalCompositeOperation = mode;
  ctx.rotate(rot); ctx.scale(scale, scale); ctx.translate(ox, oy);
  ctx.fillStyle = ctx.createPattern(tile, 'repeat');
  const R = Math.hypot(W, H) / scale;
  ctx.fillRect(-ox - R, -oy - R, 2 * R, 2 * R);
  ctx.restore();
}
const NT = { big: noiseTile(256, 3, 5, 101, 2.3), mid: noiseTile(256, 12, 4, 202, 2.4), fine: noiseTile(256, 48, 3, 303, 2.2), grain: noiseTile(256, 128, 1, 404, 1.5) };
NT.big.cells = 3; NT.mid.cells = 12; NT.fine.cells = 48; NT.grain.cells = 128;
const GLSL_NOISE = `
float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x), mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x), f.y); }
float fbm3(vec2 p){ return 0.57 * vnoise(p) + 0.29 * vnoise(p * 2.03 + 7.1) + 0.14 * vnoise(p * 4.07 + 13.7); }
`;

// ═══════════════════════════ 2. 渲染器 / 相机 ═══════════════════════════
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance', stencil: false });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.info.autoReset = false;
const gl = renderer.getContext();
const dbgExt = gl.getExtension('WEBGL_debug_renderer_info');
const GL_RENDERER = String(dbgExt ? gl.getParameter(dbgExt.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
const SOFTWARE = /swiftshader|llvmpipe|software|basic render/i.test(GL_RENDERER);
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

/**
 * 相机:和现在的守卫战同一个构图 —— 高俯角看地面,水晶在左、两排英雄格在左 1/3、怪从右边沿中间走道过来,
 * 石坎(平台)在画面上方约 1/4 处,再往上是远景。用窄视角(19°)让上下两排的大小差别不至于太夸张。
 */
const CAM = { fov: 19, pitch: 31, h: 16.8, d: 24.85, x: -0.4 };
const PITCH = THREE.MathUtils.degToRad(CAM.pitch);
const camera = new THREE.PerspectiveCamera(CAM.fov, 16 / 9, 4, 700);
camera.rotation.order = 'YXZ';
camera.rotation.set(-PITCH, 0, 0);
camera.position.set(CAM.x, CAM.h, CAM.d);
const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0x74849f);
scene.background = FOG_COLOR.clone();
scene.fog = new THREE.FogExp2(FOG_COLOR.clone(), 0.0045);
scene.add(camera);   // 远景贴在镜头上
const noAO = [];   // 这些东西不参与环境光遮蔽(纸片 / 贴花 / 粒子 / 雾 / 远景)

// ═══════════════════════════ 3. 战场布局(世界坐标,米) ═══════════════════════════
const GW = 32, GD = 14, GX0 = -16, GZ0 = -8.5;             // 地面贴图覆盖的范围
const CELL_X0 = -5.6, CELL_DX = 1.05, ROW_Z = [-3.3, 4.3];  // 英雄格:2 排 × 6 列(前 3 列已解锁)
const PAD = 0.94;
const CRYSTAL = new THREE.Vector3(-7.6, 0, 0.3);
const SPAWN_X = 10.6, GOAL_X = -5.5;
const TER_Z = -8.4, TER_BACK = -10.3, TER_H = 0.5;          // 后面的石平台
const ROAD_Z = (x) => 0.15 + 0.55 * Math.sin(x * 0.33 + 0.8) * smooth(3, 9, x);
const roadHalf = (x) => 2.5 + 0.9 * smooth(6, 14, x);
/** 这一点铺着石板的可能性:左边 2/3 是石板院子,往右渐渐碎成土路,中间零星缺几块。 */
function stoneP(x, z) {
  const n = fbm(x * 0.21 + 3.1, z * 0.21 - 1.7, 3, 11), n2 = fbm(x * 0.9 + 1.3, z * 0.9 + 5.1, 2, 12);
  let p = smooth(8.8, 4.4, x + (n - 0.5) * 6.5 + (n2 - 0.5) * 1.6);
  const hole = fbm(x * 0.5 - 4.0, z * 0.5 + 8.0, 3, 13);
  p *= 1 - 0.9 * smooth(0.6, 0.68, hole) * smooth(-3.5, 0.5, x);
  return clamp(p, 0, 1);
}
/** 这一点长草的可能性:土路两侧、平台脚下、缺砖的坑里。 */
function grassP(x, z) {
  const n = fbm(x * 0.33 - 7.3, z * 0.33 + 2.2, 3, 23);
  const dz = Math.abs(z - ROAD_Z(x));
  let g = smooth(roadHalf(x) - 0.4, roadHalf(x) + 1.2, dz + (n - 0.5) * 2.4) * smooth(3.6, 7.2, x + (n - 0.5) * 3);
  g = Math.max(g, smooth(-6.9, -8.0, z - (n - 0.5) * 1.8) * smooth(0.4, 0.6, n) * 0.95);
  g = Math.max(g, (1 - smooth(0.2, 0.6, stoneP(x, z))) * smooth(0.42, 0.58, n) * smooth(7.5, 3.0, x));
  return clamp(g, 0, 1);
}

// ═══════════════════════════ 4. 程序贴图 ═══════════════════════════
/** 高度图 → 法线图(显卡上做一遍索贝尔;手机上比在主线程逐像素算快得多)。 */
const bakeScene = new THREE.Scene(), bakeCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const bakeMat = new THREE.ShaderMaterial({
  uniforms: { tH: { value: null }, texel: { value: new THREE.Vector2() }, k: { value: 1 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `uniform sampler2D tH; uniform vec2 texel; uniform float k; varying vec2 vUv;
    float H(vec2 o){ return texture2D(tH, vUv + o * texel).r; }
    void main(){
      float dx = (H(vec2(1.,-1.)) + 2. * H(vec2(1.,0.)) + H(vec2(1.,1.))) - (H(vec2(-1.,-1.)) + 2. * H(vec2(-1.,0.)) + H(vec2(-1.,1.)));
      float dy = (H(vec2(-1.,1.)) + 2. * H(vec2(0.,1.)) + H(vec2(1.,1.))) - (H(vec2(-1.,-1.)) + 2. * H(vec2(0.,-1.)) + H(vec2(1.,-1.)));
      vec3 n = normalize(vec3(-dx * k * 0.25, -dy * k * 0.25, 1.0));
      gl_FragColor = vec4(n * 0.5 + 0.5, 1.0);
    }`,
  depthTest: false, depthWrite: false,
});
bakeScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bakeMat));
function bakeNormal(heightCanvas, strength, repeat, old) {
  const w = heightCanvas.width, h = heightCanvas.height;
  const src = new THREE.CanvasTexture(heightCanvas);
  src.colorSpace = THREE.NoColorSpace; src.generateMipmaps = false; src.minFilter = src.magFilter = THREE.LinearFilter;
  src.wrapS = src.wrapT = repeat ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
  if (old) old.dispose();
  const rt = new THREE.WebGLRenderTarget(w, h, { depthBuffer: false, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter });
  rt.texture.wrapS = rt.texture.wrapT = repeat ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
  rt.texture.colorSpace = THREE.NoColorSpace; rt.texture.anisotropy = Math.min(8, MAX_ANISO);
  bakeMat.uniforms.tH.value = src; bakeMat.uniforms.texel.value.set(1 / w, 1 / h); bakeMat.uniforms.k.value = strength;
  const prev = renderer.getRenderTarget();
  renderer.setRenderTarget(rt); renderer.render(bakeScene, bakeCam); renderer.setRenderTarget(prev);
  src.dispose();
  return rt;
}
function canvasTex(cv, srgb, repeat) {
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = repeat ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
  t.anisotropy = Math.min(8, MAX_ANISO);
  return t;
}

/** 铺石地面的每块石板(世界坐标),地面贴图和草丛摆放共用。行缝带起伏、竖缝略歪、大小不一、偶尔一劈两半,免得像砌砖墙。 */
const STONES = (() => {
  const rnd = mulberry32(4242), list = [], rows = [];
  let z = GZ0 - 0.7;
  while (z < GZ0 + GD + 0.7) { const dz = 0.82 + rnd() * 0.72; rows.push([z, z + dz]); z += dz; }
  const wob = (zl, x, k) => zl + (fbm(x * 0.3 + k * 3.7, k * 1.9 + 0.5, 2, 61) - 0.5) * 0.36;
  rows.forEach((r, ri) => {
    let x = GX0 - rnd() * 2.2, lT = (rnd() - 0.5) * 0.12, lB = (rnd() - 0.5) * 0.12;
    while (x < GX0 + GW + 0.8) {
      const w = 0.72 + Math.pow(rnd(), 1.7) * 1.95, nT = (rnd() - 0.5) * 0.14, nB = (rnd() - 0.5) * 0.14, x0 = x, a = lT, b = lB;
      const zAt = (xx, f) => lerp(wob(r[0], xx, ri), wob(r[1], xx, ri + 1), f);
      const piece = (fa, fb) => {
        const pts = [[x0 + lerp(a, b, fa), 0], [x0 + w + lerp(nT, nB, fa), 0], [x0 + w + lerp(nT, nB, fb), 0], [x0 + lerp(a, b, fb), 0]];

  const m0 = new THREE.Matrix4().makeScale(0, 0, 0); for (let i = 0; i < 44; i++) fx.spikes.setMatrixAt(i, m0); fx.spikes.instanceMatrix.needsUpdate = true;
  resetMonsters(); for (const u of units) { u.flash = 0; u.cast = 0; u.phase = u.hero ? u.def.col * 1.3 + u.def.row : units.indexOf(u) * 0.9; }
}

// ═══════════════════════════ 10. 后期 / 画质档 / 尺寸 ═══════════════════════════
let composer = null, gtao = null, bloom = null, gradePass = null;
let forced = null;   // { w, h, pr }:调试时强制画布尺寸
/** 最后一个通道:ACES 调色(和 three.js 自带的那套逐行相同)+ 转 sRGB + 暗角 + 一点颗粒,一次做完(少一遍全屏读写)。 */
const GradeShader = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uAspect: { value: 1.78 }, uExposure: { value: 1 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uAspect, uExposure; varying vec2 vUv;
    const mat3 ACESInputMat = mat3(vec3(0.59719, 0.07600, 0.02840), vec3(0.35458, 0.90834, 0.13383), vec3(0.04823, 0.01566, 0.83777));
    const mat3 ACESOutputMat = mat3(vec3(1.60475, -0.10208, -0.00327), vec3(-0.53108, 1.10813, -0.07276), vec3(-0.07367, -0.00605, 1.07602));
    vec3 fit(vec3 v){ vec3 a = v * (v + 0.0245786) - 0.000090537; vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081; return a / b; }
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + uTime) * 43758.5453); }
    void main(){ vec3 c = max(texture2D(tDiffuse, vUv).rgb, 0.0);
      c = clamp(ACESOutputMat * fit(ACESInputMat * (c * uExposure / 0.6)), 0.0, 1.0);
      c = mix(pow(c, vec3(0.41666)) * 1.055 - vec3(0.055), c * 12.92, vec3(lessThanEqual(c, vec3(0.0031308))));
      vec2 q = (vUv - 0.5) * vec2(1.0, 1.0 / max(1.0, uAspect * 0.62));
      c *= mix(1.0, 0.7, smoothstep(0.34, 0.86, length(q)));                // 暗角
      c += (h(gl_FragCoord.xy) - 0.5) * 0.014;                              // 一点点颗粒,防暗部色带
      gl_FragColor = vec4(c, 1.0); }`,
};
function buildComposer() {
  if (composer) { composer.dispose(); if (gtao) gtao.dispose(); if (bloom) bloom.dispose(); }
  composer = new EffectComposer(renderer);
  composer.renderTarget1.samples = T.msaa; composer.renderTarget2.samples = T.msaa;
  composer.addPass(new RenderPass(scene, camera));
  gtao = null;
  if (T.ao > 0) {
    gtao = new GTAOPass(scene, camera, 4, 4);
    const ss = gtao.setSize.bind(gtao); gtao.setSize = (w, h) => ss(Math.max(2, Math.round(w * T.ao)), Math.max(2, Math.round(h * T.ao)));
    const ovis = gtao.overrideVisibility.bind(gtao); gtao.overrideVisibility = () => { ovis(); for (const o of noAO) o.visible = false; };
    gtao.blendIntensity = 1.0;
    gtao.updateGtaoMaterial({ radius: 0.75, distanceExponent: 1.5, thickness: 1.3, scale: 1.25, samples: T.aoSamples, distanceFallOff: 1, screenSpaceRadius: false });
    gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 5, radiusExponent: 2, rings: 2, samples: T.aoSamples });
    composer.addPass(gtao);
  }
  bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.5, 0.6, 1.6);   // 阈值 1.6:只有真正发亮的东西(火、电、水晶光晕、强光下的水面高光)才泛
  const bs = bloom.setSize.bind(bloom); bloom.setSize = (w, h) => bs(Math.max(8, Math.round(w * T.bloom)), Math.max(8, Math.round(h * T.bloom)));
  composer.addPass(bloom);
  gradePass = new ShaderPass(GradeShader); composer.addPass(gradePass);
}
function resize() {
  const w = forced ? forced.w : window.innerWidth, h = forced ? forced.h : window.innerHeight;
  if (w < 2 || h < 2) return;   // 面板被收起时窗口是 0×0,等它再显示出来
  let pr = Math.min(window.devicePixelRatio || 1, 2, (OPT.px || T.shortSide) / Math.min(w, h));
  if (OPT.dpr) pr = OPT.dpr; if (forced && forced.pr) pr = forced.pr;
  renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
  composer.setPixelRatio(pr); composer.setSize(w, h);
  const a = w / h, base = 16 / 9;
  let fov = CAM.fov;
  if (a < base) { const hf = Math.atan(Math.tan(THREE.MathUtils.degToRad(CAM.fov / 2)) * base); fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(hf) / a)); }   // 比 16:9 窄:保住横向视野
  camera.fov = fov; camera.aspect = a; camera.updateProjectionMatrix();
  if (gradePass) gradePass.uniforms.uAspect.value = a;
  placeBackdrop();
}
function applyLighting() {   // 完整光照 / 低档的减负光照
  for (const L of brazierLights) L.visible = T.pl;
  crystalLight.visible = T.pl; fill.visible = T.env;
  scene.environment = T.env ? ENV_TEX : null;
  hemi.intensity = T.env ? 0.55 : 0.95;
  for (const m of lightPools) m.visible = !T.pl;
}
function applyTier(name) {
  if (!TIER[name]) return;
  tierName = name; T = TIER[name];
  renderer.shadowMap.enabled = T.shadow > 0; moon.castShadow = T.shadow > 0;
  if (T.shadow > 0) { moon.shadow.mapSize.set(T.shadow, T.shadow); if (moon.shadow.map) { moon.shadow.map.dispose(); moon.shadow.map = null; } }
  applyLighting();
  scene.traverse((o) => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { m.needsUpdate = true; }); });
  if (!groundTex || groundTex.res !== T.ground) buildGroundTextures(T.ground);
  if (grass) grass.count = Math.min(grass.userData.total, T.grass);
  buildComposer(); resize(); syncHud();
}

// ═══════════════════════════ 11. 界面 / 调试钩子 / 主循环 ═══════════════════════════
const $ = (s) => document.querySelector(s);
function syncHud() {
  document.querySelectorAll('[data-q]').forEach((b) => b.classList.toggle('on', b.dataset.q === tierName));
  document.querySelectorAll('[data-sp]').forEach((b) => b.classList.toggle('on', +b.dataset.sp === spriteMode));
  $('#bAuto').classList.toggle('on', sim.auto); $('#bDrift').classList.toggle('on', OPT.drift);
}
document.querySelectorAll('[data-cast]').forEach((b) => b.addEventListener('click', () => CASTS[b.dataset.cast]()));
document.querySelectorAll('[data-q]').forEach((b) => b.addEventListener('click', () => applyTier(b.dataset.q)));
document.querySelectorAll('[data-sp]').forEach((b) => b.addEventListener('click', () => setSpriteMode(+b.dataset.sp)));
$('#bAuto').addEventListener('click', () => { sim.auto = !sim.auto; sim.nextCast = sim.t + 0.5; syncHud(); });
$('#bDrift').addEventListener('click', () => { OPT.drift = !OPT.drift; syncHud(); });
window.addEventListener('resize', () => { if (!forced) resize(); });

let paused = Q.get('pause') === '1', busy = false, ready = false;
const stat = { ms: 16.7, calls: 0, tris: 0, last: 0, shown: 0 };
function render() {
  renderer.info.reset();
  if (gradePass) { gradePass.uniforms.uTime.value = (sim.t * 60) % 1000; gradePass.uniforms.uExposure.value = renderer.toneMappingExposure; }
  composer.render();
  stat.calls = renderer.info.render.calls; stat.tris = renderer.info.render.triangles;
}
function info() {
  const s = renderer.getDrawingBufferSize(new THREE.Vector2());
  return {
    renderer: GL_RENDERER, software: SOFTWARE, webgl: gl.getParameter(gl.VERSION), tier: tierName, buffer: [s.x, s.y], css: [canvas.clientWidth, canvas.clientHeight], pixelRatio: +renderer.getPixelRatio().toFixed(3), dpr: window.devicePixelRatio,
    calls: stat.calls, triangles: stat.tris, textures: renderer.info.memory.textures, geometries: renderer.info.memory.geometries, programs: renderer.info.programs ? renderer.info.programs.length : 0,
    groundTex: groundTex ? [groundTex.canvas.width, groundTex.canvas.height] : null, shadow: T.shadow, ao: T.ao, msaa: T.msaa, bloom: T.bloom, grass: grass ? grass.count : 0, particles: (pAdd ? pAdd.n : 0) + (pAlpha ? pAlpha.n : 0),
    pl: T.pl, env: T.env, spriteMode, artFallback, simT: +sim.t.toFixed(3), fpsMs: +stat.ms.toFixed(2), maxTex: renderer.capabilities.maxTextureSize, pointLights: pointLights.length,
  };
}
function frame(now) {
  requestAnimationFrame(frame);
  if (!ready || busy) { stat.last = now; return; }
  const dt = Math.min(0.05, (now - stat.last) / 1000 || 0.016); stat.last = now;
  stat.ms = lerp(stat.ms, dt * 1000, 0.06);
  if (!paused) update(dt);
  render();
  if (now - stat.shown > 500) {
    stat.shown = now; const s = renderer.getDrawingBufferSize(new THREE.Vector2());
    $('#stat').textContent = `${(1000 / stat.ms).toFixed(0)} 帧/秒  ${stat.ms.toFixed(1)} ms   画布 ${s.x}×${s.y}   批次 ${stat.calls}   三角 ${(stat.tris / 1000).toFixed(0)}k   贴图 ${renderer.info.memory.textures}\n${GL_RENDERER}${SOFTWARE ? '  (软件渲染)' : ''}${artFallback ? '\n角色图没读到(请经 http 打开),已用剪影代替' : ''}`;
  }
}
window.__dbg = {
  get ready() { return ready; },
  pause() { paused = true; }, resume() { paused = false; },
  /** 逐帧步进:推进 n 帧、每帧 dt 秒,画一帧。无头截图 / 录屏用。 */
  step(dt = 1 / 60, n = 1) { for (let i = 0; i < n; i++) update(dt); render(); return +sim.t.toFixed(4); },
  cast(name) { return CASTS[name] ? CASTS[name]() : false; },
  setAuto(v) { sim.auto = !!v; sim.nextCast = sim.t + 0.5; syncHud(); },
  setDrift(v) { OPT.drift = !!v; syncHud(); },
  setQuality(name) { applyTier(name); return info(); },
  /** 在当前档位上临时改几项再套用(拆开销用),例:tweak({ shadow: 1024 })、tweak({ full: true })。刷新页面复原。 */
  tweak(o) { Object.assign(TIER[tierName], o); applyTier(tierName); return info(); },
  setSpriteMode(m) { setSpriteMode(m); },
  /** 强制画布尺寸(css 宽高 + 像素比),给跑分用;不传参数恢复跟随窗口。 */
  setSize(w, h, pr) { forced = w ? { w, h, pr: pr || 1 } : null; canvas.style.width = w ? w + 'px' : ''; canvas.style.height = w ? h + 'px' : ''; resize(); return info(); },
  reset() { resetSim(); render(); },
  info, sim, scene, camera, renderer, THREE,
  /** 画一帧并读回画布(同一个任务里读,缓冲还在)。 */
  shot(type = 'image/jpeg', q = 0.92) { render(); return canvas.toDataURL(type, q); },
  ground(maxW = 2048) { const c = groundTex.canvas, k = Math.min(1, maxW / c.width), o = makeCanvas(Math.round(c.width * k), Math.round(c.height * k)); o.getContext('2d').drawImage(c, 0, 0, o.width, o.height); return o.toDataURL('image/jpeg', 0.9); },
  /** 跑分:不等垂直同步连着画 n 帧,每帧后读回一个像素强制显卡干完活,得到真实的单帧耗时。 */
  async bench(n = 90, warm = 20) {
    busy = true; const px = new Uint8Array(4), times = [];
    for (let i = 0; i < n + warm; i++) {
      const t0 = performance.now(); update(1 / 60); render(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); const t1 = performance.now();
      if (i >= warm) times.push(t1 - t0);
      if (i % 8 === 7) await new Promise((r) => setTimeout(r, 0));
    }
    busy = false; times.sort((a, b) => a - b);
    const avg = times.reduce((a, b) => a + b, 0) / times.length;
    return { avg: +avg.toFixed(2), median: +times[times.length >> 1].toFixed(2), p95: +times[Math.floor(times.length * 0.95)].toFixed(2), max: +times[times.length - 1].toFixed(2), frames: times.length, ...info() };
  },
};

(async () => {
  buildWorld(); buildCrystal(); buildFlames(); buildVista();
  buildGroundTextures(T.ground);   // CONTACTS 要先由 buildWorld 填好
  buildGrass(); buildFx(); buildLightPools();
  renderer.shadowMap.enabled = T.shadow > 0; moon.castShadow = T.shadow > 0; moon.shadow.mapSize.set(T.shadow || 512, T.shadow || 512);
  applyLighting();
  buildComposer(); resize();
  await Promise.all(Object.keys(ART).map(loadArt));
  buildUnits(); buildGolem(); resetSim(); syncHud();
  if (artFallback) console.warn('[proto3d] 角色图没读到,已用剪影代替。请用 python tools/proto3d/guard_battle/serve.py 起服务后经 http 打开。');
  $('#msg').style.display = 'none';
  render(); ready = true;
})().catch((err) => { console.error(err); $('#msg').textContent = '出错了:' + (err && err.message ? err.message : err); });
requestAnimationFrame(frame);
</script>
</body>
